<script>
    function getURL(page) {
        var pageurl = location.protocol + '//' + location.hostname + '/' + page;
        location.replace(pageurl);
    }

    $(document).ready(function () {
        // Get the current path
        var current = location.pathname.split('/').pop();

        // Reset active class for all links
        $("a.nav-link").removeClass('active');

        // Add active class to the matching nav link
        $("a.nav-link").each(function () {
            var $this = $(this);
            if ($this.data('page') === current) {
                $this.addClass('active');
            }
        });
    });
</script>

<script>
    // GSAP Animations
    gsap.registerPlugin(ScrollTrigger);

    // Contact Section Animation
    gsap.from('.contact-section .section-title', {
        scrollTrigger: {
            trigger: '.contact-section',
            start: 'top center+=100',
            toggleActions: 'play none none reverse'
        },
        duration: 1,
        y: 50,
        opacity: 0,
        ease: 'power3.out'
    });

    // Contact Info Animation
    gsap.from('.contact-info', {
        scrollTrigger: {
            trigger: '.contact-info',
            start: 'top center+=100',
            toggleActions: 'play none none reverse'
        },
        duration: 1,
        y: 30,
        opacity: 0,
        delay: 0.3,
        ease: 'power3.out'
    });

    // Featured Image Animation
    gsap.from('.featured-image', {
        scrollTrigger: {
            trigger: '.featured-image',
            start: 'top center+=100',
            toggleActions: 'play none none reverse'
        },
        duration: 1,
        y: 50,
        opacity: 0,
        delay: 0.6,
        ease: 'power3.out'
    });

    // Sticky Header
    const navSection = document.querySelector('.nav-section');
    let lastScroll = 0;

    window.addEventListener('scroll', () => {
        const currentScroll = window.pageYOffset;
        
        if (currentScroll > 50) {
            navSection.classList.add('scrolled');
        } else {
            navSection.classList.remove('scrolled');
        }
        
        lastScroll = currentScroll;
    });

    // Scroll Progress Bar
    window.addEventListener('scroll', () => {
        const scrollProgress = document.querySelector('.scroll-progress');
        const windowHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        const scrollPercent = (window.scrollY / windowHeight) * 100;
        scrollProgress.style.width = scrollPercent + '%';
    });
</script>
